name: Build iOS ESP Spam Menu
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare source tree
        run: |
          if [ -f "hii_Flydigi_Integrated.zip" ]; then
            unzip -o -q "hii_Flydigi_Integrated.zip"
          fi
          if [ -d "hii" ] && [ ! -f "CMakeLists.txt" ]; then
            cp -R hii/* .
            cp -R hii/.github . 2>/dev/null || true
          fi
      - name: Show Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
      - name: Portable checks
        run: |
          cmake -S . -B build-core -DVT_UI_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core --parallel 2
          ctest --test-dir build-core --output-on-failure
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build arm64 library
        run: bash build_dylib.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VTMenu-iOS-ESP-Spam-R5
          path: dist/
          if-no-files-found: error
          retention-days: 7
